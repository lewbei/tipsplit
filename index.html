<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tip Calculator</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --card: #fffaf3;
      --ink: #1f1a14;
      --muted: #6b6158;
      --accent: #c45c26;
      --accent-soft: #f3d6c4;
      --line: #e6ddd2;
      --shadow: 0 18px 50px rgba(47, 32, 16, 0.12);
    }

    :root[data-theme="dark"] {
      --bg: #161311;
      --card: #221c18;
      --ink: #f6efe7;
      --muted: #b8aea3;
      --accent: #e08a4f;
      --accent-soft: #3a2a21;
      --line: #3a322c;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, var(--accent-soft), transparent 40%),
        var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.6rem;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    button.theme {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin: 16px 0 8px;
    }

    input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1.05rem;
    }

    .tips {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .tips button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 12px;
      padding: 10px 0;
      cursor: pointer;
    }

    .tips button.active,
    .tips button:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .totals {
      margin-top: 24px;
      display: grid;
      gap: 10px;
      padding: 16px;
      border-radius: 16px;
      background: var(--accent-soft);
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .row strong {
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <div>
        <h1>Tip calculator</h1>
        <p>Split a bill and watch the total update live.</p>
      </div>
      <button class="theme" id="themeToggle" type="button">Dark</button>
    </header>

    <label for="bill">Bill amount</label>
    <input id="bill" type="number" min="0" step="0.01" value="48.50" />

    <label>Tip percent</label>
    <div class="tips" id="tipButtons">
      <button type="button" data-tip="10">10%</button>
      <button type="button" data-tip="15" class="active">15%</button>
      <button type="button" data-tip="18">18%</button>
      <button type="button" data-tip="20">20%</button>
    </div>

    <label for="customTip">Custom tip %</label>
    <input id="customTip" type="number" min="0" step="0.1" value="15" />

    <label for="people">People</label>
    <input id="people" type="number" min="1" step="1" value="2" />

    <section class="totals">
      <div class="row"><span>Tip</span><span id="tipAmount">$0.00</span></div>
      <div class="row"><span>Total</span><strong id="total">$0.00</strong></div>
      <div class="row"><span>Per person</span><span id="perPerson">$0.00</span></div>
    </section>
  </main>

  <script>
    const billInput = document.getElementById("bill");
    const customTip = document.getElementById("customTip");
    const peopleInput = document.getElementById("people");
    const tipButtons = document.getElementById("tipButtons");
    const themeToggle = document.getElementById("themeToggle");

    function money(n) {
      return `$${n.toFixed(2)}`;
    }

    function update() {
      const bill = Math.max(0, Number(billInput.value) || 0);
      const tipPercent = Math.max(0, Number(customTip.value) || 0);
      const people = Math.max(1, Math.floor(Number(peopleInput.value) || 1));
      const tip = bill * (tipPercent / 100);
      const total = bill + tip;

      document.getElementById("tipAmount").textContent = money(tip);
      document.getElementById("total").textContent = money(total);
      document.getElementById("perPerson").textContent = money(total / people);
    }

    tipButtons.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-tip]");
      if (!button) return;
      tipButtons.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
      button.classList.add("active");
      customTip.value = button.dataset.tip;
      update();
    });

    customTip.addEventListener("input", () => {
      tipButtons.querySelectorAll("button").forEach((b) => {
        b.classList.toggle("active", b.dataset.tip === String(Number(customTip.value)));
      });
      update();
    });

    billInput.addEventListener("input", update);
    peopleInput.addEventListener("input", update);

    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      themeToggle.textContent = next === "dark" ? "Light" : "Dark";
    });

    update();
  </script>
</body>
</html>
